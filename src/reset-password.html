<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votify — Сброс пароля</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', sans-serif;
        background: #1a1a2e;
        color: #e8e8e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 40px;
        max-width: 420px;
        width: 90%;
        text-align: center;
      }
      .card h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #d0bcff;
      }
      .card p {
        font-size: 14px;
        opacity: 0.7;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      .input-group {
        position: relative;
        margin-bottom: 16px;
      }
      .input-group input {
        width: 100%;
        padding: 14px 16px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        color: #e8e8e8;
        font-size: 15px;
        font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.2s;
      }
      .input-group input:focus {
        border-color: #d0bcff;
      }
      .input-group input::placeholder {
        color: rgba(255,255,255,0.3);
      }
      .btn {
        width: 100%;
        padding: 14px;
        background: #6750A4;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover { background: #7c6bb5; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .msg { margin-top: 16px; font-size: 13px; line-height: 1.4; }
      .msg.error { color: #f28b82; }
      .msg.success { color: #81c995; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loading-state">
        <h1>Votify</h1>
        <p>Проверяем ссылку для сброса пароля...</p>
      </div>

      <div id="reset-form" class="hidden">
        <h1>Новый пароль</h1>
        <p>Введите новый пароль для вашего аккаунта</p>
        <div class="input-group">
          <input type="password" id="new-password" placeholder="Новый пароль (мин. 6 символов)" minlength="6" />
        </div>
        <div class="input-group">
          <input type="password" id="confirm-password" placeholder="Повторите пароль" minlength="6" />
        </div>
        <button class="btn" id="reset-btn">Сменить пароль</button>
        <div class="msg" id="msg"></div>
      </div>

      <div id="done-state" class="hidden">
        <h1>Готово!</h1>
        <p id="done-msg">Пароль успешно изменён. Теперь вы можете войти в приложение.</p>
      </div>
    </div>

    <script>
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const type = params.get('type');

      const loadingState = document.getElementById('loading-state');
      const resetForm = document.getElementById('reset-form');
      const doneState = document.getElementById('done-state');
      const msg = document.getElementById('msg');
      const resetBtn = document.getElementById('reset-btn');

      if (type === 'recovery' && accessToken) {
        loadingState.classList.add('hidden');
        resetForm.classList.remove('hidden');
      } else {
        loadingState.innerHTML = '<h1>Votify</h1><p>Ссылка недействительна или истекла. Запросите сброс пароля заново.</p>';
      }

      resetBtn.addEventListener('click', async () => {
        const pw = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (pw.length < 6) {
          msg.textContent = 'Пароль должен быть не менее 6 символов';
          msg.className = 'msg error';
          return;
        }
        if (pw !== confirm) {
          msg.textContent = 'Пароли не совпадают';
          msg.className = 'msg error';
          return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = 'Сохраняем...';

        try {
          const resp = await fetch('/api/auth/update-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: accessToken, newPassword: pw }),
          });
          const data = await resp.json();

          if (resp.ok) {
            resetForm.classList.add('hidden');
            doneState.classList.remove('hidden');
          } else {
            msg.textContent = data.error || 'Ошибка при смене пароля';
            msg.className = 'msg error';
            resetBtn.disabled = false;
            resetBtn.textContent = 'Сменить пароль';
          }
        } catch (e) {
          msg.textContent = 'Ошибка сети: ' + e.message;
          msg.className = 'msg error';
          resetBtn.disabled = false;
          resetBtn.textContent = 'Сменить пароль';
        }
      });
    </script>
  </body>
</html>
