# Votify на своём сервере/NAS/Raspberry Pi: docker compose up -d
#
# После запуска откройте http://<адрес-сервера>:17217 с телефона и добавьте в браузере
# «на экран Домой» — приложение будет работать без компьютера.
#
# Пароль (обязателен, если сервер доступен из интернета): создайте .env рядом с этим файлом
#   VOTIFY_BASIC_AUTH=логин:пароль
services:
  votify:
    # Готовый образ из GitHub Container Registry или сборка из исходников:
    # image: ghcr.io/exieeez/votify:latest
    build: .
    container_name: votify
    restart: unless-stopped
    ports:
      - '17217:17217'
    environment:
      VOTIFY_PORT: 17217
      VOTIFY_BASIC_AUTH: ${VOTIFY_BASIC_AUTH:-}
      # Firebase Web Config (аккаунты и Мастерская тем), необязательно:
      VOTIFY_FIREBASE_CONFIG: ${VOTIFY_FIREBASE_CONFIG:-}
    volumes:
      # Аккаунты, настройки и качество звука должны пережить пересборку образа.
      - votify-data:/root/.config/Votify

volumes:
  votify-data:
