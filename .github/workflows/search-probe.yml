name: Search probe (temporary)

# One-shot: dumps username registry + profiles collection contents
# (doc ids + HTTP codes) to see what the phone query should match.
on:
  push:
    branches: ['arena/01a08c8e-votify']
    paths: ['.github/workflows/search-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CFG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}
    steps:
      - name: Probe registry and profiles
        run: |
          set +e
          API_KEY="$(echo "$CFG" | jq -r .apiKey)"
          TOKEN="$(curl -s --max-time 20 -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY" \
            -H 'Content-Type: application/json' -d '{}' | jq -r .idToken)"
          BASE_DOC="projects/votify-f461a/databases/(default)/documents"
          BASE_URL="https://firestore.googleapis.com/v1/$BASE_DOC"
          scan() {
            COLL="$1"
            OUT="$(curl -s --max-time 25 -w '\n%{http_code}' \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"structuredQuery\":{\"from\":[{\"collectionId\":\"$COLL\"}],\"orderBy\":[{\"field\":{\"fieldPath\":\"__name__\"},\"direction\":\"ASCENDING\"}],\"limit\":15}}" \
              "$BASE_URL:runQuery")"
            CODE="$(echo "$OUT" | tail -n 1)"
            IDS="$(echo "$OUT" | head -n -1 | jq -r '[.[].document.name | select(. != null) | split("/") | last] | join(",")')"
            echo "code=$CODE ids=[$IDS]"
          }
          echo "::notice::PROBE-USERNAMES $(scan usernames)"
          echo "::notice::PROBE-PROFILES $(scan profiles)"
          echo done
