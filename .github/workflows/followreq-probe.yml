name: FollowReq probe (temporary)

# One-shot: proves the followRequests get/list split is live — a missing request
# doc must 404 (not 403) for a signed-in user, and the Android-shaped username
# prefix query must 200.
on:
  push:
    branches: ['arena/01a08c8e-votify']
    paths: ['.github/workflows/followreq-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CFG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}
    steps:
      - name: Probe followRequests + usernames query
        run: |
          set +e
          API_KEY="$(echo "$CFG" | jq -r .apiKey)"
          if [ -z "$API_KEY" ] || [ "$API_KEY" = "null" ]; then
            echo "::error::VOTIFY_FIREBASE_CONFIG secret missing"
            exit 1
          fi
          TOKEN="$(curl -s --max-time 20 -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY" \
            -H 'Content-Type: application/json' -d '{}' | jq -r .idToken)"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::anon signup failed"
            exit 1
          fi
          BASE="https://firestore.googleapis.com/v1/projects/votify-f461a/databases/(default)/documents"

          # 1. Missing followRequests doc: 404 = fixed, 403 = old rules.
          C1="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/followRequests/probe_nonexistent_aaa_bbb")"
          echo "::notice::PROBE1 missing-followRequests-get=$C1 (want 404)"

          # 2. Control: missing follows doc must 404 too.
          C2="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/follows/probe_nonexistent_aaa_bbb")"
          echo "::notice::PROBE2 missing-follows-get=$C2 (want 404)"

          # 3. Android-shaped usernames prefix query must 200.
          C3="$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"structuredQuery":{"from":[{"collectionId":"usernames"}],"orderBy":[{"field":{"fieldPath":"__name__"},"direction":"ASCENDING"}],"startAt":{"values":[{"referenceValue":"projects/votify-f461a/databases/(default)/documents/usernames/ke"}]},"endAt":{"values":[{"referenceValue":"projects/votify-f461a/databases/(default)/documents/usernames/ke\uf8ff"}]},"limit":8}}' \
            "$BASE:runQuery")"
          echo "::notice::PROBE3 usernames-prefix-query=$C3 (want 200)"
          echo "done"
