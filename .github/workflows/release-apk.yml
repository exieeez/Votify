name: Release APK

# Rolling pre-release tagged `android-debug`: every build replaces the APK so the
# download link stays the same — https://github.com/exieeez/Votify/releases/download/android-debug/Votify-debug.apk
on:
  push:
    branches: ['arena/01a0816e-votify']
    paths: ['android/**', '.github/workflows/release-apk.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Firebase Web Config injected into BuildConfig at build time (from a secret,
    # never committed; masked out of logs automatically).
    env:
      VOTIFY_FIREBASE_CONFIG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      # Single build. Package id comes from OriginOS' dynamic-island whitelist (see
      # build.gradle.kts): the island only renders apps hardcoded in the OS. vivo's
      # i管家 signature-pins famous packages (com.apple.android.music got blocked as a
      # «counterfeit app»), so we ship under an obscure whitelisted player id.
      # RELEASE variant (stable signing): debug Compose builds render noticeably slower —
      # release is the fix for the «app feels like it's not running at 120 Hz» reports.
      # Kept under the permanent Votify-debug.apk release link.
      - name: Build release APK (OriginOS island package)
        run: |
          ./gradlew --no-daemon --console=plain assembleRelease -PvotifyIslandPackage=com.hiby.music
          cp app/build/outputs/apk/release/app-release.apk Votify-debug.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-debug"
          ls -la Votify-debug.apk

          # GitHub's release CDN occasionally stalls at ~100% for some ISPs.
          # Keep 72h mirrors on external hosts as fallback download links
          # (re-uploaded on every build, so they are always fresh).
          mirror() {
            curl -sf -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$1" \
              https://litterbox.catbox.moe/resources/internals/api.php || true
          }
          LB_DEBUG=$(mirror Votify-debug.apk)
          GF_DEBUG=$(curl -sf -F "file=@Votify-debug.apk" https://upload.gofile.io/uploadFile | jq -r '.data.downloadPage // empty' 2>/dev/null || true)

          {
            echo "Автосборка APK из ветки $GITHUB_REF_NAME (коммит $GITHUB_SHA)."
            echo
            echo "Единая сборка с package id из вайтлиста «островка» OriginOS (com.hiby.music) — трек показывается в Dynamic Spot как у Spotify. Для Google-входа добавьте в Firebase это Android-приложение (пакет com.hiby.music, SHA-1 8D:A3:BC:F4:59:CF:30:C9:54:EE:F6:51:98:6B:80:27:36:DC:50:7A)."
            echo
            echo "Сервер (опционально): Настройки → Интеграции → Прокси → адрес http://<IP-вашего-ПК>:17217"
            if [ -n "$LB_DEBUG" ] || [ -n "$GF_DEBUG" ]; then
              echo
              echo "Зеркала на 72 часа (если скачивание с GitHub зависает):"
              [ -n "$LB_DEBUG" ] && echo "• Votify-debug.apk (litterbox): $LB_DEBUG"
              [ -n "$GF_DEBUG" ] && echo "• Votify-debug.apk (gofile): $GF_DEBUG"
            fi
          } > notes.md

          # (Re)create the rolling prerelease, then upload the fresh APKs.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || true
          gh release create "$TAG" "Votify-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Votify Android — свежая debug-сборка" \
            --notes-file notes.md \
            --prerelease
