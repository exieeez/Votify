name: App-query probe (temporary)

# One-shot: dump raw doc ids of `usernames` (repr codepoints) + direct GETs.
on:
  push:
    branches: ['arena/01a08c8e-votify']
    paths: ['.github/workflows/app-query-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CFG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}
    steps:
      - name: Dump raw username doc ids
        run: |
          set +e
          API_KEY="$(echo "$CFG" | jq -r .apiKey)"
          TOKEN="$(curl -s --max-time 20 -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY" \
            -H 'Content-Type: application/json' -d '{}' | jq -r .idToken)"
          BASE_DOC="projects/votify-f461a/databases/(default)/documents"
          BASE_URL="https://firestore.googleapis.com/v1/$BASE_DOC"
          LIST="$(curl -s --max-time 25 -H "Authorization: Bearer $TOKEN" "$BASE_URL/usernames?pageSize=50")"
          echo "$LIST" | python3 -c "import json,sys;[print('::notice::DOC-REPR:',ascii(d['name'].split('/')[-1]),'uid=',d.get('fields',{}).get('uid',{}).get('stringValue')) for d in json.load(sys.stdin).get('documents',[])]"
          for N in dodik god; do
            CODE="$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE_URL/usernames/$N")"
            echo "::notice::GET $N code=$CODE"
          done
          echo done
