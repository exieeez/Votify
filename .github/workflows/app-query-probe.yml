name: App-query probe (temporary)

# One-shot: verify startAt.before=true includes the exact doc for full "dodik".
on:
  push:
    branches: ['arena/01a08c8e-votify']
    paths: ['.github/workflows/app-query-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CFG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}
    steps:
      - name: Verify inclusive startAt
        run: |
          set +e
          API_KEY="$(echo "$CFG" | jq -r .apiKey)"
          TOKEN="$(curl -s --max-time 20 -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY" \
            -H 'Content-Type: application/json' -d '{}' | jq -r .idToken)"
          BASE_DOC="projects/votify-f461a/databases/(default)/documents"
          BASE_URL="https://firestore.googleapis.com/v1/$BASE_DOC"
          BODY="$(jq -n --arg base "$BASE_DOC/usernames" '{structuredQuery:{from:[{collectionId:"usernames"}],orderBy:[{field:{fieldPath:"__name__"},direction:"ASCENDING"}],startAt:{values:[{referenceValue:($base+"/dodik")}],before:true},endAt:{values:[{referenceValue:($base+"/dodik\uf8ff")}],before:false},limit:8}}')"
          OUT="$(curl -s --max-time 25 -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE_URL:runQuery")"
          CODE="$(echo "$OUT" | tail -n 1)"
          IDS="$(echo "$OUT" | head -n -1 | jq -r '[.[].document.name | select(. != null) | split("/") | last] | join(",")' 2>/dev/null)"
          echo "::notice::FIXQ-DODIK code=$CODE ids=[$IDS]"
          echo done
