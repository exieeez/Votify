name: Docker image

# Готовый образ для любого хостинга (VPS, NAS, Raspberry Pi, Render, Fly):
#   docker run -p 17217:17217 -v votify-data:/root/.config/Votify \
#     -e VOTIFY_BASIC_AUTH=логин:пароль ghcr.io/exieeez/votify:latest
on:
  push:
    branches: ['main', 'android', 'arena/**']
    paths: ['Dockerfile', '.dockerignore', 'server.js', 'routes/**', 'utils.js', 'src/**', 'package.json', '.github/workflows/docker.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR принимает только имя в нижнем регистре, а репозиторий — exieeez/Votify.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
