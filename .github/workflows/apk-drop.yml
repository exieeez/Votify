# TEMPORARY helper: drops the latest CI-built APK onto a throwaway branch so it
# can be fetched over plain git (some sandboxes block GitHub binary CDNs).
# Delete this file after use.
name: APK Drop

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/apk-drop.yml']
  workflow_dispatch:

jobs:
  drop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK from rolling release and push to drop branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download android-debug --repo "$GITHUB_REPOSITORY" \
            -p "Votify-debug.apk" -O /tmp/Votify-debug.apk
          ls -la /tmp/Votify-debug.apk
          git config user.name "arena-bot"
          git config user.email "arena-bot@local"
          git checkout --orphan arena/apk-drop
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/Votify-debug.apk ./Votify-debug.apk
          git add Votify-debug.apk
          git commit -m "APK drop from $GITHUB_SHA"
          git push origin arena/apk-drop --force
