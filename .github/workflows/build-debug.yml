name: Build Debug Errors
# TEMPORARY debug workflow: compiles and surfaces kotlinc errors as annotations.
on:
  push:
    branches: [arena/01a08c8e-votify]
    paths: [.github/workflows/build-debug.yml]

jobs:
  errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and report errors
        working-directory: android
        run: |
          ./gradlew :app:compileDebugKotlin --console=plain 2>&1 | tee build.log || true
          grep -E "^e: " build.log | head -n 30 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's/^e: ([^:]+):.*/\1/')
            echo "::error file=$file::$line"
          done
          if grep -qE "^e: " build.log; then exit 1; fi
          echo "COMPILE-OK"
