name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Тег релиза (например v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: установщик .exe (NSIS)
          - os: windows-latest
            args: '--win nsis --x64'
          # Linux: AppImage + .deb
          - os: ubuntu-latest
            args: '--linux AppImage deb --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Firebase Web Config (секрет репозитория) кладётся в firebase-config.json
      # до упаковки, чтобы в собранном приложении работал вход в аккаунт.
      - name: Prepare Firebase config
        run: node scripts/prepare-firebase-config.js
        env:
          VOTIFY_FIREBASE_CONFIG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}

      # Кэш electron и инструментов electron-builder: без него каждый прогон тянет
      # сотни мегабайт с GitHub и иногда ловит лимит «too many requests».
      - name: Cache electron and builder tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Build
        id: build
        continue-on-error: true
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      # Второй заход: если первый упал на скачивании инструментов (сетевой сбой или
      # лимит GitHub) — повтор обычно проходит.
      - name: Build (повтор)
        if: steps.build.outcome == 'failure'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        continue-on-error: true

      - name: Build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Сборка не удалась. Логи electron-builder — в шагах Build выше."
          ls -la dist 2>/dev/null | head -20
          exit 1

      # Скрипт установки и иконка едут вместе с релизом: по ним работает команда
      #   curl -fsSL .../releases/latest/download/install.sh | bash
      - name: Copy installer assets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp src/icons/icon-512.png dist/votify-icon.png
          cp scripts/install.sh dist/install.sh

      - name: Publish Windows assets
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Votify ${{ inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Linux assets
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Votify ${{ inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/install.sh
            dist/votify-icon.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
