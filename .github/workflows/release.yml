name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: 'build:win'
            artifacts: 'dist/*.exe'
          - os: ubuntu-latest
            script: 'build:appimage'
            artifacts: 'dist/*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        # NOTE: must go through the npm scripts (not bare electron-builder) so the
        # prebuild hooks bake firebase-config.json into the package — otherwise the
        # app ships without cloud accounts ("Firebase не настроен").
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          VOTIFY_FIREBASE_CONFIG: ${{ secrets.VOTIFY_FIREBASE_CONFIG }}

      - name: Verify Firebase config was packaged
        shell: bash
        run: |
          if [ ! -s firebase-config.json ]; then
            echo "::error::firebase-config.json missing — the app would ship without cloud accounts"
            exit 1
          fi
          echo "::notice::firebase-config.json packed into the app"

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Votify ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ matrix.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
