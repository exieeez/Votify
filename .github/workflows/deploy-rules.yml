name: Deploy Firestore Rules

# Auto-publishes firestore.rules to votify-f461a so clients never 403 on missing
# collections again. One-time setup by the Firebase project owner:
#   1) run `npx firebase-tools login:ci`, copy the token it prints;
#   2) paste it as the FIREBASE_TOKEN repo secret (Settings → Secrets → Actions).
# After that, every push touching firestore.rules redeploys it automatically.
on:
  push:
    branches: ['main', 'arena/**']
    paths: ['firestore.rules', '.github/workflows/deploy-rules.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy firestore.rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is missing — see the setup note at the top of deploy-rules.yml"
            exit 1
          fi
          npx -y firebase-tools@15.26.0 deploy --only firestore:rules --project votify-f461a --token "$FIREBASE_TOKEN" --non-interactive 2>&1 | tee deploy.log; STATUS=${PIPESTATUS[0]}
          tail -c 800 deploy.log | tr '\n' ' ' > tail.txt
          echo "::notice::DEPLOY-EXIT status=$STATUS tail=$(cat tail.txt)"
          exit $STATUS

      - name: Verify social rules are live
        run: |
          set +e
          APIKEY="AIzaSyBSRslJWfFlpgX3Sm3_RbXEILtj2PL0A-k"
          FS="https://firestore.googleapis.com/v1/projects/votify-f461a/databases/(default)/documents"
          SIGNUP=$(curl -s --max-time 20 "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$APIKEY" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}')
          TOKEN=$(echo "$SIGNUP" | jq -r '.idToken // empty')
          UID=$(echo "$SIGNUP" | jq -r '.localId // empty')
          if [ -z "$TOKEN" ]; then
            RND="verify$RANDOM$RANDOM@example.com"
            SIGNUP=$(curl -s --max-time 20 "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$APIKEY" -H 'Content-Type: application/json' -d "{\"email\":\"$RND\",\"password\":\"Verify12345678!\",\"returnSecureToken\":true}")
            TOKEN=$(echo "$SIGNUP" | jq -r '.idToken // empty')
            UID=$(echo "$SIGNUP" | jq -r '.localId // empty')
          fi
          if [ -z "$TOKEN" ]; then echo "signup failed"; exit 1; fi
          # Rules propagate within seconds — poll instead of failing on a stale read.
          CODE="000"
          for i in 1 2 3 4 5 6 7 8 9; do
            CODE=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$FS/profiles/$UID")
            echo "attempt $i: own-profile-read code=$CODE (want 404)"
            if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then break; fi
            sleep 20
          done
          curl -s --max-time 20 "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$APIKEY" -H 'Content-Type: application/json' -d "{\"idToken\":\"$TOKEN\"}" -o /dev/null || true
          [ "$CODE" = "404" ] || [ "$CODE" = "200" ]
