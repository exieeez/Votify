name: Android CI

on:
  push:
    branches: ['arena/01a07e3f-votify']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Build
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      # Surface compiler errors in the job summary + annotations so they can be read
      # through the GitHub API even when raw logs are not reachable.
      - name: Report errors
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo '```'
            grep -E "^(e: |w: .*error|> Task .* FAILED|FAILURE|\* What went wrong|Execution failed|Caused by|Unresolved|error:|Error:|Could not)" build.log | head -120
            echo '```'
            echo "### Tail"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -50 | while IFS= read -r line; do
            # e: file:///path/File.kt:12:5 message
            f=$(echo "$line" | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) .*#\1#')
            l=$(echo "$line" | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) .*#\2#')
            m=$(echo "$line" | sed -E 's#^e: file://[^ ]+ ##')
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=${l}::${m}"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: votify-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
