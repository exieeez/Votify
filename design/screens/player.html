ace text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-28 flex flex-col justify-between px-margin-screen"><div class="h-6 flex items-center justify-between text-on-surface-variant font-label-md text-label-md pt-space-4"><span class="font-label-lg text-label-lg font-semibold text-on-surface">14:00</span><div class="flex items-center gap-space-8"><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div><div class="h-16 flex items-center justify-between"><div class="flex items-center gap-space-8 min-w-0"><button aria-label="Назад" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors shrink-0" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><span class="material-symbols-outlined text-[24px] text-primary shrink-0">graphic_eq</span><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Сейчас Играет</h1></div><div class="flex items-center gap-space-4 shrink-0"><button aria-label="Поделиться" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined">share</span></button><button aria-label="Меню опций" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined">more_vert</span></button><div class="w-11 h-11 flex items-center justify-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDotG3GG5Wg6osSoWupdtF--N_gmxkteigTk1hFM4nAJusDr70E8NA0OIb_Jd-eXel43Y5ndL9VbM2VDGiaM5huHh0XYfSZcLA4zcHdRU5JR5wQKzW-o-rwJewYgK8pKl2NlDbE7CEHbBIuJ0sJvYhRhZlb_iMMKCHrMA7ctNMQ2luy5lvohNLfLJjiUh-s9N0Um3GucOdYb-AJVualmaqmLLQqzbxvtnsWBKF7ltBbYzOt4_ps25qR"></div></div></div></div></header><main class="flex flex-col relative w-full pt-28 pb-safe bg-surface px-margin-screen"><div class="flex flex-col w-full pb-space-32 select-none relative">

<!-- Top Context Bar (Matching Reference pill style) -->
<div class="flex items-center justify-between w-full py-space-8 z-10">
<button aria-label="Свернуть плеер" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-container text-primary hover:bg-surface-container-high active:scale-95 transition-transform" type="button"><span class="material-symbols-outlined text-[24px]">keyboard_arrow_down</span></button>
<div class="flex items-center gap-space-8 px-space-16 py-space-8 rounded-full bg-surface-container-high/70 backdrop-blur-md shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary">playlist_play</span>
<span class="font-label-md text-label-md text-on-surface tracking-wide">Плейлист дня</span>
</div>
<button aria-label="Дополнительные действия" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-container text-primary hover:bg-surface-container-high active:scale-95 transition-transform" type="button"><span class="material-symbols-outlined text-[22px]">more_vert</span></button>
</div>
<!-- Vinyl Centerpiece Stage -->
<div class="flex flex-col items-center justify-center relative my-space-16 z-10">
<div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
<div class="w-full h-full rounded-full p-space-4 bg-gradient-to-tr from-surface-container-lowest via-surface-container-high to-surface-container-lowest shadow-2xl relative overflow-hidden flex items-center justify-center transition-transform duration-700" id="vinyl-disc" style="transform: rotate(6.3deg);">
<!-- Vinyl grooves effect -->
<div class="absolute inset-0 rounded-full bg-[radial-gradient(circle,transparent_45%,rgba(0,0,0,0.7)_60%,transparent_70%,rgba(0,0,0,0.5)_95%)] pointer-events-none z-10 opacity-70"></div>
<!-- Track artwork -->
<div class="w-full h-full rounded-full overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="Intimate indie pop album cover portrait of a young girl taking a mirror selfie wearing an olive green crochet top, warm soft lighting, subtle grain and authentic bedroom aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3Q9iAf-dApB-dJfuHuB4pHznWnJsWTVch28-hSJlw5q0vogkJeWUhG69GFe8MX7CmOLbmmGPT-o6D6uA7Xv3KOlQ-ds_rtg17EDB3NMwGvqkPR-NCHAXWrD6vk1MZgx17mUCU-fRxSldFR54lKY_AlEzb1pfn2KB0OLLu7qQ2KZz8Tw9bcg1OiNKhACmB2pX5qK2mrCZAsBMz-kw-RGkjM17aFtwKJ0YRO2mdQ77JnaC7TC8NKCb_6yBLSHKieex7NQ">
</div>
<!-- Center spindle vinyl hole -->
<div class="absolute w-7 h-7 rounded-full bg-surface shadow-inner z-20 flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-lowest"></div>
</div>
</div>
</div>
<!-- Heart and Plus Action Row around title -->
<div class="flex items-center justify-between w-full px-space-20 mt-space-20">
<button aria-label="Нравится" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:text-tertiary active:scale-90 transition-all" id="like-btn" type="button"><span class="material-symbols-outlined text-[28px] text-primary" id="like-icon">favorite_border</span></button>
<!-- Track and Artist Info -->
<div class="flex flex-col items-center text-center px-space-8 min-w-0 max-w-[65%]">
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold truncate w-full tracking-tight">черновик</h2>
<p class="font-body-md text-body-md text-on-surface-variant tracking-wider uppercase mt-space-2 truncate w-full font-medium">CUPSIZE</p>
</div>
<button aria-label="Добавить в плейлист" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all" id="add-btn" type="button"><span class="material-symbols-outlined text-[28px] text-primary" id="add-icon">add_circle</span></button>
</div>
</div>
<!-- Audio Scrubber / Seek Bar -->
<div class="flex flex-col w-full px-space-8 mt-space-8 z-10">
<div class="relative w-full py-space-8 flex items-center cursor-pointer group" id="progress-container"><div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full transition-all duration-150" id="progress-fill" style="width: 0%;"></div></div><div class="absolute w-1.5 h-4 bg-primary rounded-full shadow-md group-hover:scale-125 transition-transform" id="progress-thumb" style="left: 0%;"></div></div>
<div class="flex justify-between items-center text-on-surface-variant font-label-sm text-label-sm px-space-2 -mt-space-4">
<span id="curr-time" class="">0:00</span>
<span class="">2:28</span>
</div>
</div>
<!-- Main Playback Controls Surface Card -->
<div class="w-full mt-space-16 p-space-16 rounded-3xl bg-surface-container-low/90 backdrop-blur-md flex items-center justify-between shadow-lg z-10"><button aria-label="Повтор" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform" id="repeat-btn" type="button"><div class="relative flex items-center justify-center"><span class="material-symbols-outlined text-[24px]">repeat</span><span class="absolute -top-1 -right-2 text-[9px] font-bold bg-primary text-pitch-black rounded-full w-3.5 h-3.5 flex items-center justify-center">1</span></div></button><button aria-label="Предыдущий трек" class="w-12 h-12 rounded-full flex items-center justify-center text-primary active:scale-90 transition-all" id="prev-btn" type="button"><span class="material-symbols-outlined text-[32px]">skip_previous</span></button><div class="relative flex items-center justify-center"><div class="absolute inset-0 rounded-full bg-white/20 blur-md animate-pulse pointer-events-none scale-125"></div><button aria-label="Воспроизведение" class="relative w-[72px] h-[72px] rounded-full bg-white text-black flex items-center justify-center shadow-2xl shadow-white/30 hover:scale-105 active:scale-95 transition-transform cursor-pointer" id="play-pause-btn" type="button"><span class="material-symbols-outlined text-[38px] text-black font-bold select-none" id="play-pause-icon" style="font-variation-settings: 'FILL' 1;">pause</span></button></div><button aria-label="Следующий трек" class="w-12 h-12 rounded-full flex items-center justify-center text-primary active:scale-90 transition-all" id="next-btn" type="button"><span class="material-symbols-outlined text-[32px]">skip_next</span></button><button aria-label="Перемешать" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform" id="shuffle-btn" type="button"><span class="material-symbols-outlined text-[24px]">shuffle</span></button></div>
<!-- Bottom Secondary Audio Utility Bar -->
<div class="w-full mt-space-12 px-space-12 py-space-10 rounded-2xl bg-surface-container/70 backdrop-blur-sm flex items-center justify-around z-10"><button aria-label="Текст песни" class="flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-colors p-space-8" type="button"><span class="font-title-lg text-title-lg font-bold leading-none">T</span></button><button aria-label="Эквалайзер" class="flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-colors p-space-8" type="button"><span class="material-symbols-outlined text-[24px]">tune</span></button><button aria-label="Режим" class="flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-colors p-space-8" type="button"><span class="material-symbols-outlined text-[24px]">speed</span></button><button aria-label="Очередь воспроизведения" class="flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-colors p-space-8 relative" type="button"><div class="relative flex items-center justify-center"><span class="material-symbols-outlined text-[24px]">format_list_bulleted</span><span class="absolute -top-1.5 -right-3 px-1.5 py-0.2 bg-primary text-pitch-black font-label-sm text-[10px] font-bold rounded-full">13</span></div></button></div>
</div>
<script>
  (function() {
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    const vinylDisc = document.getElementById('vinyl-disc');
    const likeBtn = document.getElementById('like-btn');
    const likeIcon = document.getElementById('like-icon');
    const addBtn = document.getElementById('add-btn');
    const addIcon = document.getElementById('add-icon');
    const shuffleBtn = document.getElementById('shuffle-btn');

    let isPlaying = true;
    let rotationDeg = 0;
    let animFrame = null;

    function spinVinyl() {
      if (isPlaying) {
        rotationDeg = (rotationDeg + 0.35) % 360;
        if (vinylDisc) vinylDisc.style.transform = `rotate(${rotationDeg}deg)`;
        animFrame = requestAnimationFrame(spinVinyl);
      }
    }
    spinVinyl();

    if (playPauseBtn && playPauseIcon) {
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playPauseIcon.textContent = 'pause';
          spinVinyl();
        } else {
          playPauseIcon.textContent = 'play_arrow';
          cancelAnimationFrame(animFrame);
        }
      });
    }

    let isLiked = false;
    if (likeBtn && likeIcon) {
      likeBtn.addEventListener('click', () => {
        isLiked = !isLiked;
        if (isLiked) {
          likeIcon.style.fontVariationSettings = "'FILL' 1";
          likeIcon.classList.remove('text-on-surface-variant');
          likeIcon.classList.add('text-tertiary-fixed-dim');
        } else {
          likeIcon.style.fontVariationSettings = "'FILL' 0";
          likeIcon.classList.remove('text-tertiary-fixed-dim');
          likeIcon.classList.add('text-on-surface-variant');
        }
      });
    }

    let isAdded = false;
    if (addBtn && addIcon) {
      addBtn.addEventListener('click', () => {
        isAdded = !isAdded;
        if (isAdded) {
          addIcon.textContent = 'check_circle';
          addIcon.classList.add('text-primary');
        } else {
          addIcon.textContent = 'add_circle';
          addIcon.classList.remove('text-primary');
        }
      });
    }

    let isShuffled = false;
    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', () => {
        isShuffled = !isShuffled;
        shuffleBtn.classList.toggle('text-primary', isShuffled);
        shuffleBtn.classList.toggle('text-on-surface-variant', !isShuffled);
      });
    }
  })();
</script></main>

</body></html>
